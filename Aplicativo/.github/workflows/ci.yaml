name: Flow Agenda CI/CD - Testes Completos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Executar testes diariamente às 2h
    - cron: '0 2 * * *'
  workflow_dispatch:  # Permitir execução manual

jobs:
  # JOB 1: Linting e Análise Estática
  linting:
    name: 🔍 Linting e Análise Estática
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt
    
    - name: Check formatting with Black
      run: |
        black --check --diff . || echo "::warning::Black formatting issues found"
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff . || echo "::warning::Import sorting issues found"
    
    - name: Lint with Flake8
      run: |
        flake8 . --count --statistics --show-source
    
    - name: Lint with Pylint
      run: |
        pylint flow_agenda.py --fail-under=7.0 --exit-zero || echo "::warning::Pylint issues found"
    
    - name: Type checking with mypy
      run: |
        mypy flow_agenda.py --ignore-missing-imports || echo "::warning::Type checking issues found"
    
    - name: Security scan with Bandit
      run: |
        bandit -r . -f json -o bandit-report.json || echo "::warning::Security issues found"
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report-python${{ matrix.python-version }}
        path: bandit-report.json
    
    - name: Check docstrings with pydocstyle
      run: |
        pydocstyle flow_agenda.py --convention=google || echo "::warning::Docstring issues found"
    
    - name: Check complexity with Radon
      run: |
        radon cc flow_agenda.py -a -nb
        radon mi flow_agenda.py -s

  # JOB 2: Testes Unitários
  unit-tests:
    name: 🧪 Testes Unitários
    runs-on: ${{ matrix.os }}
    needs: linting
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt
        pip install pytest-xdist pytest-cov pytest-qt
    
    - name: Run unit tests with coverage
      run: |
        pytest tests/test_unitarios/ -v \
          --cov=flow_agenda \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          -n auto \
          -m "not slow"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
          .coverage

  # JOB 3: Testes de Integração
  integration-tests:
    name: 🔗 Testes de Integração
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt
    
    - name: Run integration tests
      run: |
        pytest tests/test_integracao/ -v --tb=short --timeout=60
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: |
          test-results/
          .pytest_cache/

  # JOB 4: Testes E2E
  e2e-tests:
    name: 🎯 Testes End-to-End
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 xvfb
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -r requirements.txt
        pip install pytest-timeout pytest-qt
    
    - name: Run E2E tests with virtual display
      run: |
        xvfb-run --auto-servernum pytest tests/test_e2e/ -v \
          --tb=short \
          --timeout=300 \
          --maxfail=3 \
          --durations=10
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: |
          test-results/
          screenshots/
          logs/

  # JOB 5: Testes de Performance
  performance-tests:
    name: ⚡ Testes de Performance
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-benchmark
        pip install -r requirements.txt
    
    - name: Run performance benchmarks
      run: |
        pytest tests/test_performance.py --benchmark-only --benchmark-json=benchmark-results.json
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: benchmark-results.json

  # JOB 6: Análise de Qualidade
  quality-gate:
    name: 🚦 Quality Gate
    runs-on: ubuntu-latest
    needs: [linting, unit-tests, integration-tests, e2e-tests]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        echo "## 📊 Quality Gate Results" >> $GITHUB_STEP_SUMMARY
        
        # Verificar status dos jobs
        if [[ "${{ needs.linting.result }}" != "success" ]]; then
          echo "❌ Linting failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
        if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
          echo "❌ Unit tests failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
        if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "❌ Integration tests failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
        if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
          echo "❌ E2E tests failed" >> $GITHUB_STEP_SUMMARY
          exit 1
        fi
        
        echo "✅ All quality checks passed!" >> $GITHUB_STEP_SUMMARY

  # JOB 7: Build e Distribuição
  build:
    name: 📦 Build Executável
    runs-on: ${{ matrix.os }}
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            output_name: FlowAgenda-Linux
          - os: windows-latest
            output_name: FlowAgenda-Windows.exe
          - os: macos-latest
            output_name: FlowAgenda-macOS
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed --name FlowAgenda flow_agenda.py
    
    - name: Build with PyInstaller (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --windowed --name FlowAgenda flow_agenda.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output_name }}
        path: dist/FlowAgenda*
        if-no-files-found: error