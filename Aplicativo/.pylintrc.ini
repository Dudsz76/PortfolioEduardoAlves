[MASTER]
ignore=tests/fixtures
ignore-patterns=test_.*\.py

[MESSAGES CONTROL]
disable=
    C0111,  # missing-docstring
    C0103,  # invalid-name
    R0903,  # too-few-public-methods
    R0201,  # no-self-use
    W0511,  # fixme
    C0415,  # import-outside-toplevel

[FORMAT]
max-line-length=100
indent-string='    '
max-module-lines=2000

[DESIGN]
max-args=10
max-locals=20
max-returns=6
max-branches=15
max-statements=60

[IMPORTS]
allow-any-import-level=2